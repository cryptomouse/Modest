#
# cfg/default.toml
#

# encoding of the source files we read
encoding = "utf-8"

target_name = "Default"
machine_name = "Generic"

arch="riscv32"
endianness = "little"
abi="ilp32"
fpu="none"
features = ["omit-frame-pointer"]


word_width = 64
size_width = 64
integer_width = 32
float_width = 64
pointer_width = 64
char_width = 8

# decimal floating point compile time precision
precision = 256

libs = [""]

public_vars_forbidden = false


[backend]
default = "none"

# encoding of the files the backend writes
encoding = "utf-8"

[backend.llvm]
target_datalayout = "e-m:o-i64:64-i128:128-n32:64-S128"
target_triple = "arm64-apple-macosx27.0.0"

[backend.c11]
int_width = 32
long_width = 32
long_long_width = 64
true_literal = "true"
false_literal = "false"
output_style = "legacy"

[backend.modest]
# where a body's '{' goes: "same-line" (func f: () -> T {) or "next-line"
# ('{' alone on the line after the header) — applies to func, if, else, while
brace_style = "same-line"
# where 'else' goes: "same-line" (} else) or "next-line" (else on the line
# after the '}'). next-line is experimental — see docs/lang/stmt/block.md
else_style = "same-line"


